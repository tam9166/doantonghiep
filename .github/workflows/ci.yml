name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Java and Vue applications
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_URL: jdbc:sqlserver://127.0.0.1:1433;databaseName=RestaurantDB;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true
      DB_USERNAME: sa
      DB_PASSWORD: MocVi_CI_2026_StrongPass!
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: MocVi_CI_2026_StrongPass!
          MSSQL_SA_PASSWORD: MocVi_CI_2026_StrongPass!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "bash -c '</dev/tcp/127.0.0.1/1433'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Scan tracked source for secrets
        shell: pwsh
        run: ./scripts/security-scan.ps1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/nha-hang-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: Frontend/nha-hang-frontend
        run: npm ci

      - name: Lint frontend
        working-directory: Frontend/nha-hang-frontend
        run: npm run lint

      - name: Test frontend
        working-directory: Frontend/nha-hang-frontend
        run: npm run test

      - name: Build frontend static assets
        working-directory: Frontend/nha-hang-frontend
        run: npm run build

      - name: Wait for SQL Server and create test database
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if docker run --rm --network host mcr.microsoft.com/mssql-tools18:latest \
              /opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1,1433 -U sa \
              -P 'MocVi_CI_2026_StrongPass!' -C -Q 'SELECT 1' >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo 'SQL Server did not become ready in time.' >&2
              exit 1
            fi
            sleep 5
          done
          docker run --rm --network host mcr.microsoft.com/mssql-tools18:latest \
            /opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1,1433 -U sa \
            -P 'MocVi_CI_2026_StrongPass!' -C \
            -Q "IF DB_ID(N'RestaurantDB') IS NULL CREATE DATABASE [RestaurantDB]"

      - name: Test backend
        working-directory: quanlynhahang
        run: ./mvnw test

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: quanlynhahang/target/site/jacoco
          if-no-files-found: warn

      - name: Package backend
        working-directory: quanlynhahang
        run: ./mvnw package -DskipTests
