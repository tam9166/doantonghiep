name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Java and Vue applications
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Scan tracked source for secrets
        shell: pwsh
        run: ./scripts/security-scan.ps1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/nha-hang-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: Frontend/nha-hang-frontend
        run: npm ci

      - name: Lint frontend
        working-directory: Frontend/nha-hang-frontend
        run: npm run lint

      - name: Test frontend
        working-directory: Frontend/nha-hang-frontend
        run: npm run test

      - name: Build frontend static assets
        working-directory: Frontend/nha-hang-frontend
        run: npm run build

      - name: Test backend
        working-directory: quanlynhahang
        run: ./mvnw test

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: quanlynhahang/target/site/jacoco
          if-no-files-found: warn

      - name: Package backend
        working-directory: quanlynhahang
        run: ./mvnw package -DskipTests
