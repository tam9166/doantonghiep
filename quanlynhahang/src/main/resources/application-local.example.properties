spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=RestaurantDB;encrypt=true;trustServerCertificate=true;characterEncoding=UTF-8;sendStringParametersAsUnicode=true}
spring.datasource.username=${DB_USERNAME:your_db_user}
spring.datasource.password=${DB_PASSWORD:change_me}
app.jwt.secret=${JWT_SECRET:change_me_to_a_random_value_at_least_32_chars}
app.jwt.expiration-ms=${JWT_EXPIRATION:900000}
app.jwt.issuer=${JWT_ISSUER:restaurant-api}
app.jwt.audience=${JWT_AUDIENCE:restaurant-web}
app.jwt.key-id=${JWT_KEY_ID:primary}
restaurant.payment.webhook-secret=${PAYMENT_WEBHOOK_SECRET:change_me_to_a_random_webhook_secret}
restaurant.payment.webhook-timestamp-tolerance-seconds=${PAYMENT_WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS:300}
restaurant.payment.bank-code=MB
restaurant.payment.bank-bin=970422
restaurant.payment.account-number=your_bank_account_number
restaurant.payment.account-holder=your_account_holder_name
restaurant.payment.qr-provider=VIETQR
restaurant.payment.qr-expiration-minutes=15
restaurant.payment.demo-mode=false
gemini.api.key=${GEMINI_API_KEY:}
restaurant.info.name=${RESTAURANT_NAME:Moc Vi Restaurant}
restaurant.info.address=${RESTAURANT_ADDRESS:137 Nguyen Thi Thap, Da Nang}
restaurant.info.hotline=${RESTAURANT_HOTLINE:0347944028}
restaurant.info.email=${RESTAURANT_EMAIL:contact@mocvi.vn}
restaurant.info.opening-hours=${RESTAURANT_OPENING_HOURS:09:00 - 23:00}
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
app.upload.root=${UPLOAD_ROOT:uploads}
app.upload.private-root=${PRIVATE_UPLOAD_ROOT:private-uploads}
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
logging.level.org.hibernate.orm.deprecation=${HIBERNATE_DEPRECATION_LOG_LEVEL:ERROR}
spring.thymeleaf.check-template-location=false
app.captcha.enabled=${CAPTCHA_ENABLED:false}
app.captcha.provider=${CAPTCHA_PROVIDER:mock}
app.captcha.secret=${CAPTCHA_SECRET:}
app.captcha.min-score=${CAPTCHA_MIN_SCORE:0.5}
app.captcha.verify-url=${CAPTCHA_VERIFY_URL:}
app.captcha.mock-token=${CAPTCHA_MOCK_TOKEN:local-dev-captcha-token}
restaurant.reservation.deposit-expiry-minutes=${RESERVATION_DEPOSIT_EXPIRY_MINUTES:15}
restaurant.reservation.no-show-grace-minutes=${RESERVATION_NO_SHOW_GRACE_MINUTES:30}
restaurant.reservation.expiry-initial-delay-ms=${RESERVATION_EXPIRY_INITIAL_DELAY_MS:60000}
restaurant.reservation.expiry-scan-ms=${RESERVATION_EXPIRY_SCAN_MS:60000}
