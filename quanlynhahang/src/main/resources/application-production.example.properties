spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION:28800000}
app.jwt.issuer=${JWT_ISSUER:restaurant-api}
app.jwt.audience=${JWT_AUDIENCE:restaurant-web}
app.jwt.key-id=${JWT_KEY_ID:primary}
restaurant.payment.webhook-secret=${PAYMENT_WEBHOOK_SECRET}
restaurant.payment.webhook-timestamp-tolerance-seconds=${PAYMENT_WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS:300}
restaurant.payment.bank-code=${RESTAURANT_PAYMENT_BANK_CODE}
restaurant.payment.bank-bin=${RESTAURANT_PAYMENT_BANK_BIN:970422}
restaurant.payment.account-number=${RESTAURANT_PAYMENT_ACCOUNT_NUMBER}
restaurant.payment.account-holder=${RESTAURANT_PAYMENT_ACCOUNT_HOLDER}
restaurant.payment.qr-provider=${RESTAURANT_PAYMENT_QR_PROVIDER:VIETQR}
restaurant.payment.qr-expiration-minutes=${RESTAURANT_PAYMENT_QR_EXPIRATION_MINUTES:15}
restaurant.payment.demo-mode=${RESTAURANT_PAYMENT_DEMO_MODE:false}
gemini.api.key=${GEMINI_API_KEY}
restaurant.info.name=${RESTAURANT_NAME}
restaurant.info.address=${RESTAURANT_ADDRESS}
restaurant.info.hotline=${RESTAURANT_HOTLINE}
restaurant.info.email=${RESTAURANT_EMAIL}
restaurant.info.opening-hours=${RESTAURANT_OPENING_HOURS}
app.cors.allowed-origins=${ALLOWED_ORIGINS}
app.upload.root=${UPLOAD_ROOT}
app.upload.private-root=${PRIVATE_UPLOAD_ROOT}
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
logging.level.org.hibernate.orm.deprecation=${HIBERNATE_DEPRECATION_LOG_LEVEL:ERROR}
spring.thymeleaf.check-template-location=false
app.captcha.enabled=${CAPTCHA_ENABLED:true}
app.captcha.provider=${CAPTCHA_PROVIDER:turnstile}
app.captcha.secret=${CAPTCHA_SECRET}
app.captcha.min-score=${CAPTCHA_MIN_SCORE:0.5}
app.captcha.verify-url=${CAPTCHA_VERIFY_URL:}
app.captcha.mock-token=${CAPTCHA_MOCK_TOKEN:}
restaurant.reservation.deposit-expiry-minutes=${RESERVATION_DEPOSIT_EXPIRY_MINUTES:15}
restaurant.reservation.no-show-grace-minutes=${RESERVATION_NO_SHOW_GRACE_MINUTES:15}
restaurant.reservation.expiry-initial-delay-ms=${RESERVATION_EXPIRY_INITIAL_DELAY_MS:60000}
restaurant.reservation.expiry-scan-ms=${RESERVATION_EXPIRY_SCAN_MS:60000}
