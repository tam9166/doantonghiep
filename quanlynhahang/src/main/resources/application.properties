spring.application.name=quanlynhahang

# 1. THÔNG TIN KẾT NỐI (Bổ sung sendStringParametersAsUnicode)
# Việc thêm tham số này giúp Spring gửi dữ liệu Unicode xuống SQL Server chuẩn hơn
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=RestaurantDB;encrypt=true;trustServerCertificate=true;characterEncoding=UTF-8;sendStringParametersAsUnicode=true
spring.datasource.username=nhat
spring.datasource.password=123456
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# 2. CẤU HÌNH HIBERNATE / JPA
# 🛑 ĐÃ SỬA THÀNH 'none': Cấm Java tự động sửa đổi bảng trong CSDL để tránh xung đột sập Server
# ÉP JAVA XUỐNG CẬP NHẬT LẠI CỘT BẢNG THÀNH NVARCHAR
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Sử dụng Dialect cụ thể hơn cho các bản SQL Server đời mới
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# 3. CẤU HÌNH BỔ SUNG (Rất quan trọng cho đồ án)
# Tránh lỗi 500 khi gặp quan hệ vòng (Circular Reference) giữa Product và Category
spring.jackson.serialization.fail-on-empty-beans=false

# Hiện log chi tiết của Security để dễ soi lỗi 403/400 trong Console Java
logging.level.org.springframework.security=DEBUG

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=UTF-8
server.servlet.encoding.enabled=true

