spring.application.name=quanlynhahang
spring.profiles.default=dev

# 1. THÔNG TIN KẾT NỐI (Bổ sung sendStringParametersAsUnicode)
# Việc thêm tham số này giúp Spring gửi dữ liệu Unicode xuống SQL Server chuẩn hơn
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=RestaurantDB;encrypt=true;trustServerCertificate=true;characterEncoding=UTF-8;sendStringParametersAsUnicode=true}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# 2. CẤU HÌNH HIBERNATE / JPA
# 🛑 ĐÃ SỬA THÀNH 'none': Cấm Java tự động sửa đổi bảng trong CSDL để tránh xung đột sập Server
# ÉP JAVA XUỐNG CẬP NHẬT LẠI CỘT BẢNG THÀNH NVARCHAR
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
# Sử dụng Dialect cụ thể hơn cho các bản SQL Server đời mới
spring.jpa.open-in-view=false

# 3. CẤU HÌNH BỔ SUNG (Rất quan trọng cho đồ án)
# Tránh lỗi 500 khi gặp quan hệ vòng (Circular Reference) giữa Product và Category
spring.jackson.serialization.fail-on-empty-beans=false

# Hiện log chi tiết của Security để dễ soi lỗi 403/400 trong Console Java
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
logging.level.org.hibernate.orm.deprecation=${HIBERNATE_DEPRECATION_LOG_LEVEL:ERROR}
spring.thymeleaf.check-template-location=false

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
spring.messages.encoding=UTF-8

restaurant.reservation.deposit-rate=0.50
restaurant.reservation.deposit-expiry-minutes=${RESERVATION_DEPOSIT_EXPIRY_MINUTES:15}
restaurant.reservation.no-show-grace-minutes=${RESERVATION_NO_SHOW_GRACE_MINUTES:30}
restaurant.reservation.expiry-initial-delay-ms=${RESERVATION_EXPIRY_INITIAL_DELAY_MS:60000}
restaurant.reservation.expiry-scan-ms=${RESERVATION_EXPIRY_SCAN_MS:60000}
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

restaurant.payment.webhook-secret=${PAYMENT_WEBHOOK_SECRET:}
restaurant.payment.webhook-timestamp-tolerance-seconds=${PAYMENT_WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS:300}
app.upload.root=${UPLOAD_ROOT:uploads}
app.upload.private-root=${PRIVATE_UPLOAD_ROOT:private-uploads}
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.captcha.enabled=${CAPTCHA_ENABLED:false}
app.captcha.provider=${CAPTCHA_PROVIDER:mock}
app.captcha.secret=${CAPTCHA_SECRET:}
app.captcha.min-score=${CAPTCHA_MIN_SCORE:0.5}
app.captcha.verify-url=${CAPTCHA_VERIFY_URL:}
app.captcha.mock-token=${CAPTCHA_MOCK_TOKEN:}

# 4. TÍCH HỢP AI
gemini.api.key=${GEMINI_API_KEY:}
