spring.application.name=quanlynhahang
spring.profiles.default=dev
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8080}

# 1. THÔNG TIN KẾT NỐI (Bổ sung sendStringParametersAsUnicode)
# Việc thêm tham số này giúp Spring gửi dữ liệu Unicode xuống SQL Server chuẩn hơn
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=RestaurantDB;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# 2. CẤU HÌNH HIBERNATE / JPA
# 🛑 ĐÃ SỬA THÀNH 'none': Cấm Java tự động sửa đổi bảng trong CSDL để tránh xung đột sập Server
# ÉP JAVA XUỐNG CẬP NHẬT LẠI CỘT BẢNG THÀNH NVARCHAR
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
# Sử dụng Dialect cụ thể hơn cho các bản SQL Server đời mới
spring.jpa.open-in-view=false

# Versioned schema changes. Existing installations are baselined before V003.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
spring.flyway.validate-migration-naming=true

# 3. CẤU HÌNH BỔ SUNG (Rất quan trọng cho đồ án)
# Tránh lỗi 500 khi gặp quan hệ vòng (Circular Reference) giữa Product và Category
spring.jackson.serialization.fail-on-empty-beans=false

# Hiện log chi tiết của Security để dễ soi lỗi 403/400 trong Console Java
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
logging.level.org.hibernate.orm.deprecation=${HIBERNATE_DEPRECATION_LOG_LEVEL:ERROR}
spring.thymeleaf.check-template-location=false

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
spring.messages.encoding=UTF-8

restaurant.reservation.deposit-rate=0.50
restaurant.reservation.deposit-expiry-minutes=${RESERVATION_DEPOSIT_EXPIRY_MINUTES:15}
restaurant.reservation.no-show-grace-minutes=${RESERVATION_NO_SHOW_GRACE_MINUTES:15}
restaurant.reservation.expiry-initial-delay-ms=${RESERVATION_EXPIRY_INITIAL_DELAY_MS:60000}
restaurant.reservation.expiry-scan-ms=${RESERVATION_EXPIRY_SCAN_MS:60000}
app.cors.allowed-origins=${ALLOWED_ORIGINS:}
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION:900000}
app.jwt.issuer=${JWT_ISSUER:restaurant-api}
app.jwt.audience=${JWT_AUDIENCE:restaurant-web}
app.jwt.key-id=${JWT_KEY_ID:primary}

restaurant.payment.webhook-secret=${PAYMENT_WEBHOOK_SECRET:}
restaurant.payment.webhook-timestamp-tolerance-seconds=${PAYMENT_WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS:300}
app.upload.root=${UPLOAD_ROOT:uploads}
app.upload.private-root=${PRIVATE_UPLOAD_ROOT:private-uploads}
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.global-limit=${RATE_LIMIT_GLOBAL_LIMIT:120}
app.rate-limit.global-window-seconds=${RATE_LIMIT_GLOBAL_WINDOW_SECONDS:60}
app.rate-limit.auth-limit=${RATE_LIMIT_AUTH_LIMIT:5}
app.rate-limit.auth-window-seconds=${RATE_LIMIT_AUTH_WINDOW_SECONDS:900}
app.request.max-json-payload-bytes=${MAX_JSON_PAYLOAD_BYTES:1048576}
app.request.max-query-length=${MAX_QUERY_LENGTH:4096}
server.tomcat.max-http-form-post-size=${MAX_FORM_PAYLOAD_SIZE:1MB}
server.tomcat.max-swallow-size=${MAX_SWALLOW_SIZE:1MB}
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_MULTIPART_REQUEST_SIZE:6MB}
app.captcha.enabled=${CAPTCHA_ENABLED:false}
app.captcha.provider=${CAPTCHA_PROVIDER:mock}
app.captcha.secret=${CAPTCHA_SECRET:}
app.captcha.min-score=${CAPTCHA_MIN_SCORE:0.5}
app.captcha.verify-url=${CAPTCHA_VERIFY_URL:}
app.captcha.mock-token=${CAPTCHA_MOCK_TOKEN:}

# Email delivery is opt-in. Configure MAIL_* in the ignored .env file before enabling it.
app.invoice-email.enabled=${INVOICE_EMAIL_ENABLED:false}
app.invoice-email.from=${INVOICE_EMAIL_FROM:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLED:true}

# 4. TÍCH HỢP AI
gemini.api.key=${GEMINI_API_KEY:}

# Restaurant information used by the public chatbot. Override these through environment variables.
restaurant.info.name=${RESTAURANT_NAME:Moc Vi Restaurant}
restaurant.info.address=${RESTAURANT_ADDRESS:137 Nguyen Thi Thap, Da Nang}
restaurant.info.hotline=${RESTAURANT_HOTLINE:0347944028}
restaurant.info.email=${RESTAURANT_EMAIL:contact@mocvi.vn}
restaurant.info.opening-hours=${RESTAURANT_OPENING_HOURS:09:00 - 23:00}
